<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>VREMA – Offline</title>
    <link rel="icon" type="image/svg+xml" href="/brand-tile.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      h1 { font-size: 18px; margin: 8px 0 4px; }
      p { font-size: 14px; color: #475569; margin: 0 0 16px; }
      .badge {
        display: inline-flex; gap: 6px; align-items: center;
        padding: 4px 10px; border-radius: 999px;
        background: #fef3c7; color: #92400e;
        font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      }
      button {
        margin-top: 8px;
        background: #0f172a; color: #f8fafc;
        border: 0; border-radius: 14px;
        padding: 12px 16px; font-size: 14px; font-weight: 600;
        width: 100%; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Offline</span>
      <h1>Keine Verbindung</h1>
      <p>VREMA ist gerade nicht erreichbar. Sobald das Netz wieder da ist, geht es weiter.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
